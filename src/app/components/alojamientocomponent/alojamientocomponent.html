<div class="container mt-4">
  <h2 class="mb-4">Explorar Alojamientos</h2>

  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5 class="card-title mb-3">Buscar</h5>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Destino</label>
          <input type="text" class="form-control" [(ngModel)]="query" placeholder="Ejemplo: Medellín">
        </div>
        <div class="col-md-2">
          <label class="form-label">Llegada</label>
          <input type="date" class="form-control" [(ngModel)]="checkin">
        </div>
        <div class="col-md-2">
          <label class="form-label">Salida</label>
          <input type="date" class="form-control" [(ngModel)]="checkout">
        </div>
        <div class="col-md-2">
          <label class="form-label">Huéspedes</label>
          <input type="number" class="form-control" min="1" [(ngModel)]="adults">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-primary w-100" (click)="buscar()" [disabled]="cargando">
            {{ cargando ? 'Buscando...' : 'Buscar' }}
          </button>
        </div>
      </div>
      <div *ngIf="errorMensaje" class="alert alert-danger mt-3 mb-0">{{ errorMensaje }}</div>
    </div>
  </div>

  <div class="card mb-4 shadow-sm bg-light">
    <div class="card-body">
      <h5 class="card-title mb-3">Filtros de Búsqueda</h5>
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Ciudad</label>
          <select class="form-select" [(ngModel)]="filtroCiudad" (change)="aplicarFiltros()">
            <option value="">Todas</option>
            <option *ngFor="let c of ciudadesDisponibles" [value]="c">{{ c }}</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Huéspedes</label>
          <input type="number" class="form-control" min="1" [(ngModel)]="filtroHuespedes" (input)="aplicarFiltros()">
        </div>
        <div class="col-md-3">
          <label class="form-label">Tipo</label>
          <select class="form-select" [(ngModel)]="filtroTipo" (change)="aplicarFiltros()">
            <option value="">Todos</option>
            <option *ngFor="let t of tiposDisponibles" [value]="t">{{ t }}</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Precio Máx.</label>
          <input type="number" class="form-control" min="0" [(ngModel)]="filtroPrecioMax" (input)="aplicarFiltros()">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button class="btn btn-outline-secondary w-100" (click)="limpiarFiltros()">Limpiar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12 text-center mt-4" *ngIf="alojamientosFiltrados.length === 0 && busquedaRealizada">
      <div class="alert alert-info">No se encontraron alojamientos con esas especificaciones</div>
    </div>
  </div>
</div>
