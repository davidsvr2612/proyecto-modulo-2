<div class="container mt-5 text-center">
  <h1 class="display-4 fw-bold text-primary">Inversiones LR</h1>
  <p class="lead text-muted">
    Encuentra el alojamiento perfecto para tus vacaciones. Explora propiedades únicas en las mejores ciudades.
  </p>
  <button class="btn btn-primary btn-lg mt-3" (click)="irABusqueda()">
    <i class="bi bi-search"></i> Buscar Alojamientos
  </button>
</div>

<div class="container mt-5">
  <h3 class="mb-4 border-bottom pb-2">Alojamientos Destacados</h3>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let aloja of destacados">
      <div class="card h-100 shadow-sm">
        <!-- Imagen
        <img [src]="aloja.imagenPrincipal" class="card-img-top" alt="{{ aloja.nombre }}" style="height: 200px; object-fit: cover;">
        -->
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ aloja.nombre }}</h5>
          <p class="card-text text-muted mb-1"><i class="bi bi-geo-alt-fill"></i> {{ aloja.ciudad }}</p>
          <p class="card-text fw-bold text-success">$ {{ aloja.precioNoche | number }} / noche</p>

          <div class="mt-auto">
            <span class="badge bg-warning text-dark">
              ★ {{ aloja.calificacion }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
