<div class="container my-5"><div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card border-0 shadow rounded-4 p-4 p-md-5"><div class="text-center mb-4"><h1 class="fw-bold text-primary">Gohome</h1><p class="text-muted">{{ modo === 'login' ? 'Inicia sesión para continuar con tus reservas.' : 'Crea tu cuenta para reservar alojamientos, vehículos y actividades.' }}</p></div><div class="btn-group w-100 mb-4"><button type="button" class="btn" [class.btn-primary]="modo === 'login'" [class.btn-outline-primary]="modo !== 'login'" (click)="cambiarModo('login')">Iniciar sesión</button><button type="button" class="btn" [class.btn-primary]="modo === 'registro'" [class.btn-outline-primary]="modo !== 'registro'" (click)="cambiarModo('registro')">Crear cuenta</button></div><form (ngSubmit)="enviar()" #authForm="ngForm">@if (modo === 'registro') {<label class="form-label">Nombre completo</label><input class="form-control mb-3" name="nombre" [(ngModel)]="nombre" required minlength="2"><label class="form-label">Correo electrónico</label>} @else {<label class="form-label">Correo electrónico</label>}<input class="form-control mb-3" type="email" name="correo" [(ngModel)]="correo" required email><label class="form-label">Contraseña</label><input class="form-control mb-3" type="password" name="password" [(ngModel)]="password" required [minlength]="modo === 'registro' ? 6 : 1">@if (modo === 'registro') {<label class="form-label">Confirmar contraseña</label><input class="form-control mb-3" type="password" name="confirmarPassword" [(ngModel)]="confirmarPassword" required>}@if (error) {<div class="alert alert-danger">{{ error }}</div>}<button class="btn btn-primary rounded-pill w-100 mt-2" type="submit" [disabled]="!authForm.valid">{{ modo === 'login' ? 'Iniciar sesión' : 'Crear cuenta' }}</button></form></div></div></div></div>
