<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow rounded-4 p-4 p-md-5">
        @if (sesion$ | async; as sesion) {
          <div class="text-center">
            <h1 class="fw-bold text-primary">Gohome</h1>
            <p class="text-muted">
              Ya iniciaste sesión como <strong>{{ sesion.nombre }}</strong> ({{ sesion.correo }}).
            </p>
            <a routerLink="/mis-reservas" class="btn btn-primary rounded-pill w-100 mb-2">Ver mis reservas</a>
            <a routerLink="/alojamientos" class="btn btn-outline-primary rounded-pill w-100 mb-2">Explorar alojamientos</a>
            <button type="button" class="btn btn-outline-secondary rounded-pill w-100" (click)="cerrarSesionActual()">
              Cerrar sesión
            </button>
          </div>
        } @else {
          <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">Gohome</h1>
            <p class="text-muted">Inicia sesión para continuar con tus reservas.</p>
          </div>

          <form (ngSubmit)="login()" #loginForm="ngForm">
            <label for="correoLogin" class="form-label">Correo electrónico</label>
            <input
              id="correoLogin"
              class="form-control mb-3"
              type="email"
              name="correo"
              placeholder="nombre@correo.com"
              autocomplete="email"
              [(ngModel)]="correo"
              required
              email
            />

            <label for="passwordLogin" class="form-label">Contraseña</label>
            <div class="input-group mb-3">
              <input
                id="passwordLogin"
                class="form-control"
                name="password"
                autocomplete="current-password"
                [type]="verPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                required
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                (click)="alternarPassword()"
                [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              >
                <i class="fa-solid" [class.fa-eye]="!verPassword" [class.fa-eye-slash]="verPassword"></i>
              </button>
            </div>

            @if (error) {
              <div class="alert alert-danger">{{ error }}</div>
            }

            <button class="btn btn-primary rounded-pill w-100 mt-2" type="submit" [disabled]="!loginForm.valid">
              Iniciar sesión
            </button>
          </form>

          <p class="text-center text-muted mt-4 mb-0">
            ¿Todavía no tienes cuenta?
            <a routerLink="/registro" queryParamsHandling="preserve">Crear cuenta</a>
          </p>
        }
      </div>
    </div>
  </div>
</div>
