<div class="container-fluid vh-100 vw-100 d-flex flex-column p-0 bg-light">
  <div class="row">
    <div class="card">
      <div class="card-body p-5">
        <h2>Bienvenido</h2>
        <p>Ingresa tus datos para iniciar sesión</p>
        <div class="container p-5">
          <div class="row mb-3">
            <label for="emailInput" class="form-label">Email address</label>
            <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" [value]="email" (input)="onEmailInput($event)">
          </div>
          <div class="row mb-3">
            <label for="userName" class="form-label">User name</label>
            <input type="text" class="form-control" id="userName" placeholder="Francisco98" [value]="username" (input)="onUsernameInput($event)">
          </div>
          <div class="row mb-3">
            <label for="passwordUser" class="form-label">Password</label>
            <input type="password" id="passwordUser" class="form-control" aria-describedby="passwordHelpBlock" [value]="password" (input)="onPasswordInput($event)">
          </div>
          <div class="row my-5">
            <button (click)="login()"
                    class="btn w-100 rounded-pill fw-bold shadow-none border-0 py-2 amazon-btn">
              Iniciar sesión
            </button>
            @if(!esValido){
              <p class="text-danger text-center mt-3">Usuario, email o contraseña no válida. Por favor intente de nuevo.</p>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
